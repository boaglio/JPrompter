name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build with the minimum supported Java version so the jar runs on Java 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Name the jar
        id: jar
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          cp "target/jprompter-$version.jar" "target/JPrompter-$version.jar"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=target/JPrompter-$version.jar" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: JPrompter-${{ steps.jar.outputs.version }}
          path: ${{ steps.jar.outputs.file }}
          if-no-files-found: error

    outputs:
      version: ${{ steps.jar.outputs.version }}

  # Native builds with a bundled Java runtime, so users don't need Java installed.
  package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest available Ubuntu, so the .deb dependencies also resolve on older distros.
          - os: ubuntu-22.04
            platform: linux-x64
            icon: packaging/jprompter.png
          - os: windows-latest
            platform: windows-x64
            icon: packaging/jprompter.ico
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The bundled runtime: the latest LTS.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/download-artifact@v8
        with:
          name: JPrompter-${{ needs.build.outputs.version }}
          path: input

      - name: Build the app image
        run: |
          jpackage --type app-image \
            --name JPrompter \
            --app-version "$VERSION" \
            --vendor "Fernando Boaglio" \
            --description "A teleprompter desktop app" \
            --input input \
            --main-jar "JPrompter-$VERSION.jar" \
            --main-class jprompter.JPrompter \
            --icon "${{ matrix.icon }}" \
            --add-modules java.base,java.desktop,java.logging,java.prefs,jdk.unsupported,jdk.accessibility \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --dest dist

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          tar -czf "JPrompter-$VERSION-linux-x64.tar.gz" -C dist JPrompter
          jpackage --type deb \
            --app-image dist/JPrompter \
            --name JPrompter \
            --app-version "$VERSION" \
            --vendor "Fernando Boaglio" \
            --description "A teleprompter desktop app" \
            --icon "${{ matrix.icon }}" \
            --license-file LICENSE \
            --about-url https://github.com/boaglio/JPrompter \
            --linux-package-name jprompter \
            --linux-menu-group AudioVideo \
            --linux-shortcut \
            --dest .

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/JPrompter -DestinationPath "JPrompter-$env:VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: JPrompter-${{ needs.build.outputs.version }}-${{ matrix.platform }}
          path: |
            *.tar.gz
            *.deb
            *.zip
          if-no-files-found: error

  # Pushing a tag like v1.0.1 publishes a GitHub release with the jar and native packages attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the tag matches the pom version
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ needs.build.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the pom.xml version ${{ needs.build.outputs.version }}"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: JPrompter-${{ needs.build.outputs.version }}*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" JPrompter-* jprompter_*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "JPrompter ${{ needs.build.outputs.version }}" \
            --generate-notes
