# ---- Sample script shown on first start --------------------------------
sample=Welcome to JPrompter.\n\
\n\
Paste or type your script in the editor, or open a text file (you can also drag and drop one onto the window). Press F5 or the Play button to start prompting.\n\
\n\
[Pause — smile] Anything inside square brackets is shown as a cue in a different color, so you can add stage directions that stand out.\n\
\n\
Choose how the text moves: Speed lets you set the scroll speed yourself, and Time lets you enter a duration, such as 3:00, so the script ends exactly on time.\n\
\n\
Keyboard shortcuts while prompting:\n\
Space starts and pauses. Up and Down change the speed. Left and Right nudge the text one line. Page Up and Page Down jump between paragraphs. Home goes back to the start. Plus and minus change the text size. T switches between Speed and Time. M mirrors the text, V flips it vertically, G toggles the reading guide and H the status overlay. F11 toggles full screen and Escape leaves it. Ctrl+E switches between the editor and the prompter.\n\
\n\
You can also scroll with the mouse wheel or drag the text, which works even while it is playing.\n\
\n\
Most USB presentation clickers and foot pedals send Page Up, Page Down or Space, so they work out of the box.\n\
\n\
Good luck with your recording!\n
