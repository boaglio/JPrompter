# ---- Sample script shown on first start --------------------------------
sample=# Bem-vindo ao JPrompter\n\
\n\
Cole ou digite seu roteiro aqui, ou abra um arquivo de texto ou Markdown (você também pode soltar um na janela). Pressione **F5** ou o botão **Iniciar** para começar.\n\
\n\
[Pausa \u2014 sorria] Tudo o que estiver entre colchetes é uma *deixa*, mostrada em outra cor, para que as indicações de cena se destaquem.\n\
\n\
## Formatação\n\
\n\
O editor mostra o Markdown do jeito que ele será lido. Use os botões acima do texto, ou o teclado:\n\
\n\
- **Negrito** com Ctrl+B, *itálico* com Ctrl+I, deixas com Ctrl+K\n\
- Títulos com Ctrl+1, Ctrl+2 e Ctrl+3\n\
- Listas, citações e ~~texto riscado~~\n\
\n\
Os símbolos do Markdown ficam ocultos, exceto na linha que você está editando.\n\
\n\
## Ritmo\n\
\n\
Escolha como o texto se move: **Velocidade** permite definir a velocidade de rolagem, e **Tempo** permite informar uma duração, como 3:00, para o roteiro terminar exatamente no tempo.\n\
\n\
## Durante a exibição\n\
\n\
Espaço inicia e pausa. Cima e Baixo mudam a velocidade. Esquerda e Direita movem o texto uma linha. Page Up e Page Down pulam entre parágrafos. Home volta ao início. Mais e menos mudam o tamanho do texto. T alterna entre Velocidade e Tempo. M espelha o texto, V o inverte na vertical, G liga e desliga a guia de leitura e H o painel de status. F11 alterna a tela cheia e Esc sai dela. Ctrl+E alterna entre o editor e o teleprompter.\n\
\n\
Você também pode rolar com a roda do mouse ou arrastar o texto, mesmo durante a exibição.\n\
\n\
A maioria dos passadores de slides USB e pedais envia Page Up, Page Down ou Espaço, então eles funcionam sem configuração.\n\
\n\
**Boa gravação!**\n
